<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mango Store · Galeria 2.0</title>
<link rel="icon" href="/mango.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ===== Marca (MARCA.md) ===== */
:root{
  --ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#a1a1a6;--tile:#f5f5f7;--linha:#d2d2d7;
  --action:#0066cc;--focus:#0071e3;--botao:#1d1d1f;--botao-hover:#3a3a3c;
  --manga:#ff9f1c;--verde:#1fb57a;--rosa:#ff5e7e;--azul:#2f7bff;--roxo:#7b5cff;--ciano:#22b5e8;
  --ease:cubic-bezier(.28,.11,.32,1);--out:cubic-bezier(.23,1,.32,1);--chegada:cubic-bezier(.16,1,.3,1);
  --gut:max(22px,calc((100vw - 1024px)/2));
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;
  color:var(--ink);background:#fff;font-size:17px;line-height:1.47;letter-spacing:-.022em;overflow-x:hidden}
img,svg{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
ul{list-style:none;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--botao);color:#fff;border-radius:980px;
  padding:12px 22px;font-size:17px;white-space:nowrap;transition:background .2s var(--ease),transform .1s ease-out}
.pill:hover{background:var(--botao-hover);text-decoration:none}
.pill:active{transform:scale(.95)}
.pill.sm{font-size:14px;padding:8px 16px}
.pill.claro{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--linha)}
.pill.claro:hover{background:var(--tile)}
.mais{font-size:17px;color:var(--action)}
.mais::after{content:" ›"}
.logo{display:inline-block;width:15px;height:17px;background:currentColor;
  -webkit-mask:url(/mango.svg) center/contain no-repeat;mask:url(/mango.svg) center/contain no-repeat}
.h-sec{font-size:clamp(32px,4.6vw,56px);font-weight:600;letter-spacing:-.035em;line-height:1.07;text-wrap:balance}
.h-sec span{color:var(--ink-2)}
.lead{font-size:clamp(19px,1.7vw,24px);line-height:1.38;color:var(--ink-2);letter-spacing:-.01em}
.preco{font-size:14px;color:var(--ink-2);letter-spacing:0}
.selo{font-size:13px;font-weight:600;color:var(--c,var(--manga));letter-spacing:0}
.vidro{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.35),0 8px 32px rgba(60,40,0,.10)}
@media (prefers-reduced-transparency:reduce){.vidro{background:#fbfaf7;-webkit-backdrop-filter:none;backdrop-filter:none}}

/* cartão que levanta e acende na cor do produto */
.lift{transition:transform .22s var(--out),box-shadow .22s var(--out)}
@media (hover:hover){
  .lift:hover{transform:translateY(-4px);
    box-shadow:0 24px 48px -22px color-mix(in srgb,var(--c) 75%,transparent),0 0 0 1.5px color-mix(in srgb,var(--c) 60%,transparent)}
}
.lift:active{transform:translateY(-1px) scale(.995)}
.art{display:grid;place-items:center}
.art img{mix-blend-mode:multiply;filter:brightness(1.03);width:100%;height:100%;object-fit:contain}
.art svg{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.10))}
.salvar{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  background:rgba(255,255,255,.72);transition:transform .12s ease-out;z-index:2}
.salvar:active{transform:scale(.9)}
.salvar[aria-pressed=true]{color:var(--rosa)}

/* ícones da navbar */
.acoes{display:flex;align-items:center;gap:2px}
.ic{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-size:20px;transition:background .15s ease-out}
.ic:hover{background:rgba(0,0,0,.06)}
.badge{position:absolute;top:3px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;
  font-size:10px;font-weight:600;display:grid;place-items:center;letter-spacing:0}
.badge[data-n="0"]{display:none}
.btn-entrar{font-size:13px;padding:7px 14px;border-radius:980px;background:var(--ink);color:#fff;white-space:nowrap;transition:background .2s}
.btn-entrar:hover{background:var(--botao-hover)}
.so-cel{display:none}
@media (max-width:760px){.so-cel{display:grid}.nao-cel{display:none!important}}

/* barra de aviso */
.aviso{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 52px;font-size:13px;
  background:var(--tile);text-align:center;letter-spacing:0}
.aviso button{position:absolute;right:10px;top:50%;translate:0 -50%;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.aviso button:hover{background:rgba(0,0,0,.06)}
[data-aviso-fechado] .aviso{display:none}

/* entrada */
.entra{animation:entra .7s var(--chegada) both}
.entra.d1{animation-delay:.08s}.entra.d2{animation-delay:.16s}.entra.d3{animation-delay:.24s}
@keyframes entra{from{opacity:0;transform:translateY(18px)}}

/* rolagem lateral sem barra */
.trilho{display:grid;grid-auto-flow:column;gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;
  scroll-padding-inline:var(--gut);padding-inline:var(--gut);scrollbar-width:none}
.trilho::-webkit-scrollbar{display:none}
.trilho>*{scroll-snap-align:start}
.setas{display:flex;gap:10px}
.seta{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center;font-size:16px;transition:background .15s}
.seta:hover{background:rgba(0,0,0,.1)}
@media (max-width:760px){.setas{display:none}}

/* serviços (ícones acendem cada um numa cor) */
.serv-ic{font-size:30px;transition:color .2s var(--ease)}
@media (hover:hover){.serv:hover .serv-ic{color:var(--c)}}

/* comparar */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,4vw,48px)}
.cmp-sel{position:relative}
.cmp-sel select{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--linha);border-radius:12px;padding:12px 36px 12px 14px;background:#fff;font-size:15px;cursor:pointer}
.cmp-sel i{position:absolute;right:12px;top:50%;translate:0 -50%;pointer-events:none}
.cmp-art{height:clamp(150px,20vw,230px);margin:18px 0 12px;background:var(--t);border-radius:24px;padding:12px}
.cmp-nome{font-size:21px;font-weight:600;letter-spacing:-.02em}
.cmp-dl{margin-top:16px;display:grid}
.cmp-dl div{padding:14px 0;border-top:1px solid var(--linha)}
.cmp-dl dt{font-size:12px;color:var(--ink-2);letter-spacing:0}
.cmp-dl dd{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.cmp-dl dd.dif{color:var(--ink);font-weight:600}
.cmp-cta{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* rodapé */
.rod{background:var(--tile);padding:36px var(--gut) 28px;font-size:12px;color:var(--ink-2);letter-spacing:0;line-height:1.5}
.rod-notas{display:grid;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--linha)}
.rod-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;padding:22px 0}
.rod h3{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:10px}
.rod ul{display:grid;gap:8px}
.rod a{color:var(--ink-2)}
.rod a:hover{color:var(--ink)}
.rod-mais{padding:16px 0;border-top:1px solid var(--linha)}
.rod-base{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--linha)}
.rod-pais{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.patro{display:inline-flex;align-items:center;gap:8px}
.ambar{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#9a5b00}
.ambar::before{content:"";width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd88a,#e8a33d 60%,#b86e0e)}
.redes{display:flex;gap:4px}
.redes a{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:17px;color:var(--ink)}
.redes a:hover{background:rgba(0,0,0,.06)}

/* ===== Painéis (busca, sacola, entrar, chat, menu) ===== */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .24s ease-out;z-index:80}
.veu[data-open]{opacity:1}
.painel{position:fixed;z-index:90;background:#fff;opacity:0;transition:transform .28s var(--out),opacity .2s ease-out}
.painel[data-open]{opacity:1;transform:none}
.painel-x{width:36px;height:36px;border-radius:50%;background:var(--tile);display:grid;place-items:center;font-size:16px;flex:none}
.painel-x:hover{background:#e8e8ed}
.gaveta{top:0;right:0;bottom:0;width:min(420px,100vw);transform:translateX(100%);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
.gaveta-topo{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 14px}
.gaveta-topo h2{font-size:24px;letter-spacing:-.03em}
.gaveta-corpo{flex:1;overflow:auto;padding:0 22px}
.gaveta-pe{padding:18px 22px 24px;border-top:1px solid var(--linha);display:grid;gap:12px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--linha)}
.item .art{width:72px;height:56px;border-radius:12px;background:var(--t)}
.item-nome{font-size:15px;font-weight:600}
.qtd{display:inline-flex;align-items:center;gap:4px;margin-top:6px;border:1px solid var(--linha);border-radius:980px;padding:2px}
.qtd button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.qtd button:hover{background:var(--tile)}
.qtd span{min-width:18px;text-align:center;font-size:14px}
.linha-total{display:flex;justify-content:space-between;font-size:15px}
.linha-total strong{font-size:19px}
.vazio{padding:48px 0;text-align:center;display:grid;gap:10px;justify-items:center}
.vazio i{font-size:44px;color:var(--ink-3)}
.ok{padding:48px 0;text-align:center;display:grid;gap:10px;justify-items:center}
.ok i{font-size:48px;color:var(--verde)}

.topo{left:0;right:0;top:0;transform:translateY(-24px);padding:22px var(--gut) 32px;border-radius:0 0 28px 28px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.busca-campo{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--linha);padding:6px 0 14px}
.busca-campo i{font-size:24px;color:var(--ink-2)}
.busca-campo input{flex:1;min-width:0;border:0;outline:0;font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-.03em;background:none}
.busca-res{padding-top:16px;display:grid;gap:2px}
.busca-res h3{font-size:12px;color:var(--ink-2);font-weight:400;margin:6px 0 6px;letter-spacing:0}
.res{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:14px;color:var(--ink);text-align:left;width:100%}
.res:hover{background:var(--tile);text-decoration:none}
.res .art{width:56px;height:44px;border-radius:10px;background:var(--t)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:980px;background:var(--tile);font-size:14px;letter-spacing:0;transition:background .15s,color .15s}
.chip:hover{background:#e8e8ed}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}

.folha{top:72px;right:max(12px,calc((100vw - 1024px)/2));width:min(380px,calc(100vw - 24px));border-radius:24px;padding:22px;
  transform:scale(.96) translateY(-6px);transform-origin:top right;box-shadow:0 24px 64px rgba(0,0,0,.18);max-height:calc(100vh - 96px);overflow:auto}
.folha-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.folha-topo h2{font-size:21px;letter-spacing:-.025em}
.campo{display:grid;gap:6px;margin-bottom:12px}
.campo label{font-size:13px;color:var(--ink-2);letter-spacing:0}
.campo input{border:1px solid var(--linha);border-radius:12px;padding:12px 14px;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
.campo input:focus{border-color:var(--focus);box-shadow:0 0 0 3px rgba(0,113,227,.18)}
.nota{font-size:12px;color:var(--ink-2);letter-spacing:0;margin-top:10px}
.bolha{background:var(--tile);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:15px;margin-bottom:8px;max-width:88%}
.bolha.eu{background:var(--azul);color:#fff;border-radius:18px 18px 6px 18px;margin-left:auto}
.chat-log{display:grid;max-height:260px;overflow:auto;margin-bottom:12px}
.chat-form{display:flex;gap:8px;margin-top:12px}
.chat-form input{flex:1;min-width:0;border:1px solid var(--linha);border-radius:980px;padding:10px 14px;font-size:15px;outline:0}
.menu-lista{display:grid;gap:4px;padding-top:8px}
.menu-lista a{font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--ink);padding:6px 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .painel{transition:opacity .2s ease-out!important;transform:none!important}
  .lift:hover,.lift:active{transform:none!important}
}

/* ===== 1 · GALERIA ===== */
.g-nav{position:sticky;top:14px;z-index:40;width:min(900px,calc(100% - 28px));margin:14px auto 0;height:52px;border-radius:999px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 0 20px}
.g-links{display:flex;gap:clamp(14px,2.4vw,26px);font-size:13px;letter-spacing:0}
.g-links a{color:var(--ink)}
.g-hero{padding:72px var(--gut) 36px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap}
.g-hero h1{flex:1 1 520px;max-width:15ch;font-size:clamp(44px,6vw,80px);font-weight:600;letter-spacing:-.05em;line-height:1}
.g-hero h1 span{color:var(--ink-2)}
.g-hero-dir{max-width:320px;display:grid;gap:8px;font-size:15px}
.g-hero-dir p{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.g-dest{margin:0 var(--gut);border-radius:32px;background:var(--t);display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:24px;
  padding:clamp(28px,5vw,56px);overflow:hidden}
.g-dest h2{font-size:clamp(40px,6vw,72px);font-weight:600;letter-spacing:-.045em;line-height:1.02}
.g-dest .lead{margin:10px 0 24px;color:var(--ink)}
.g-dest .art{aspect-ratio:4/3}
.g-dest-cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.g-cats{padding-block:44px 12px;grid-auto-columns:116px;gap:14px}
.g-cat{display:grid;justify-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;padding:8px 4px;border-radius:20px}
.g-cat:hover{text-decoration:none;background:var(--tile)}
.g-cat .art{width:100px;height:72px}
.g-cat .art svg{filter:none}
.g-cat em{font-style:normal;font-weight:400;font-size:12px;color:var(--rosa);letter-spacing:0}
.g-bloco{padding-top:64px}
.g-bloco-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:0 var(--gut) 24px}
.g-car{grid-auto-columns:min(360px,84vw);padding-block:8px 40px}
.g-card{position:relative;border-radius:28px;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.07);padding:28px;min-height:480px;display:flex;flex-direction:column}
.g-card h3{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.14;margin-top:4px}
.g-card .frase{color:var(--ink-2);margin-top:4px}
.g-card .art{flex:1;margin:18px -12px;border-radius:20px;background:var(--t);min-height:200px}
.g-card-pe{display:flex;justify-content:space-between;align-items:center;gap:12px}
.g-cinza{background:var(--tile);padding-bottom:20px;margin-top:40px}
.g-serv{grid-auto-columns:min(300px,78vw);padding-block:8px 48px}
.g-serv .serv{border-radius:28px;background:#fff;padding:28px;min-height:230px;display:flex;flex-direction:column;gap:10px;text-align:left}
.g-serv .serv h3{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.g-serv .serv p{color:var(--ink-2);font-size:15px;flex:1}
.g-acess{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 var(--gut)}
.g-acess .g-card{min-height:420px}
.g-capas{display:flex;gap:8px;margin-top:14px}
.g-capas span{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.g-cmp{padding:96px var(--gut)}
.g-cmp .h-sec{margin-bottom:36px}
@media (max-width:860px){.g-acess{grid-template-columns:1fr}.g-dest{grid-template-columns:1fr}}

/* ===== 0 · GALERIA 2.0 (26/11, revisada pela crítica do Impeccable) =====
   Regras desta versão:
   - título em duas partes só nos 3 pilares (Lançamentos, Kit, Por que Mango); o resto ganha título curto;
   - degradê é da Mango: só na campanha e no Mangy. Cartaz é cor chapada, oficina e parceiro são neutros;
   - o kit é o pico da página: maior título, mais espaço em volta. */
.g2-pagina .g-bloco{padding-top:112px}
.g2-pagina .h-sec.curto{font-size:clamp(28px,3.2vw,40px);letter-spacing:-.03em}
.g2-pagina .g-bloco-topo:has(.curto){padding-bottom:18px}

/* barra de promoção: três frases que se revezam (só CSS) */
.g2-promo{position:relative;height:40px;overflow:hidden;background:var(--tile);font-size:13px;letter-spacing:0;text-align:center}
.g2-promo p{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 16px;opacity:0;animation:g2-gira 12s infinite}
.g2-promo p:nth-child(2){animation-delay:4s}.g2-promo p:nth-child(3){animation-delay:8s}
@keyframes g2-gira{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.g2-promo p{animation:none}.g2-promo p:first-child{opacity:1}}

/* menu que abre ao passar o mouse (ou chegar por Tab) */
.g2-nav .g-links{align-items:center}
.g2-item{position:relative}
.g2-item>a{display:block;padding:16px 0}
.g2-drop{position:absolute;top:calc(100% + 6px);left:50%;translate:-50% 0;min-width:420px;border-radius:24px;padding:22px 26px;
  display:grid;grid-template-columns:1.3fr 1fr;gap:20px;opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .2s var(--out),transform .25s var(--out),visibility 0s .25s;box-shadow:0 20px 50px -20px rgba(0,0,0,.25)}
.g2-item:hover .g2-drop,.g2-item:focus-within .g2-drop{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.g2-drop h4{font-size:12px;font-weight:400;color:var(--ink-2);margin-bottom:8px;letter-spacing:0}
.g2-drop .grande a{display:block;font-size:21px;font-weight:600;letter-spacing:-.02em;color:var(--ink);padding:2px 0}
.g2-drop .peq a{display:block;font-size:13px;color:var(--ink);padding:3px 0}

/* espaço de anúncio: moldura no formato final; a etiqueta some quando a peça de verdade entrar */
.anuncio{position:relative;border-radius:32px;overflow:hidden;isolation:isolate}
.anuncio-tag{position:absolute;z-index:3;top:14px;left:14px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  font-size:11px;font-weight:600;letter-spacing:0;background:rgba(0,0,0,.32);color:#fff}

/* campanha da época, 21:9: o único degradê grande da página. Fundo fundo o bastante pro branco passar de 4,5:1 no texto */
.g2-camp{margin:28px var(--gut) 0;aspect-ratio:21/9;overflow:clip;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:20px;
  padding:clamp(28px,4vw,56px);color:#fff;
  background:radial-gradient(55% 80% at 92% 10%,#ff9f1c,transparent 70%),linear-gradient(115deg,#b5175c 0%,#d6246e 45%,#e2481f 100%)}
.g2-camp h2{font-size:clamp(44px,6.4vw,96px);font-weight:600;letter-spacing:-.04em;line-height:.95}
.g2-camp .txt>p{font-size:clamp(17px,1.5vw,21px);margin:14px 0 18px;max-width:34ch}
.g2-camp .pill{background:#fff;color:var(--ink)}
.g2-camp .acoes-camp{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:20px}
.g2-camp .acoes-camp .mais{color:#fff;font-size:15px}
.g2-camp .cena{position:relative;height:100%;min-height:260px}
.g2-camp .cena .g2-cartao{position:absolute;left:0;bottom:8%;width:78%}
.g2-camp .cena img{position:absolute;right:-4%;bottom:-14%;height:96%;width:auto;filter:drop-shadow(0 18px 24px rgba(60,0,20,.35))}
.g2-valores{display:flex;gap:8px;flex-wrap:wrap}
.g2-valores button{padding:7px 14px;border-radius:99px;font-size:14px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);transition:background .2s}
.g2-valores button[aria-pressed=true]{background:#fff;color:#b5175c;box-shadow:none}

/* cartão-presente (agora dentro da campanha) */
.g2-cartao{aspect-ratio:1.586;border-radius:clamp(12px,1.6vw,20px);position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#ff9f1c,#fd228a 45%,#7b5cff 80%,#2f7bff);box-shadow:0 30px 50px -24px rgba(0,0,0,.45);transform:rotate(-6deg)}
.g2-cartao .cab{position:absolute;left:-8%;bottom:-30%;width:70%;aspect-ratio:466/394;background:#fef6ec;
  -webkit-mask:url(../marca/mascote/mono-cabeca.webp) center/contain no-repeat;mask:url(../marca/mascote/mono-cabeca.webp) center/contain no-repeat}
.g2-cartao b{position:absolute;right:7%;top:9%;font-size:clamp(30px,4vw,56px);font-weight:700;letter-spacing:-.04em;line-height:1}
.g2-cartao b small{font-size:.4em;font-weight:600;margin-right:.1em}

/* selos dos lançamentos (texto escuro na cor, contraste ≥4,5:1) */
.g2-selo{display:inline-block;font-size:12px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 45%,#1d1d1f)}

/* O PICO: Juntos é mais doce */
.g2-pico{padding-top:150px!important;text-align:center}
.g2-pico .h-sec{font-size:clamp(48px,8vw,112px);letter-spacing:-.045em;line-height:.98;padding:0 var(--gut)}
.g2-pico .h-sec span{display:block}
.g2-pico>.lead{max-width:min(40ch,calc(100% - 2*var(--gut)));margin:18px auto 40px}
.g2-kit{margin:0 var(--gut);border-radius:36px;background:var(--tile);padding:clamp(24px,4vw,56px);display:grid;grid-template-columns:1.1fr 1fr;
  gap:clamp(24px,4vw,56px);text-align:left}
.g2-kit-escolhas{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.g2-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:99px;background:#fff;font-size:15px;
  box-shadow:inset 0 0 0 1px var(--linha);transition:box-shadow .2s,background .2s}
.g2-chip::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);opacity:.35;transition:opacity .2s}
.g2-chip[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--c)}
.g2-chip[aria-pressed=true]::before{opacity:1}
.g2-palco{display:flex;justify-content:center;align-items:flex-end;min-height:200px;margin-bottom:8px}
.g2-palco .art{width:clamp(80px,14vw,180px);height:clamp(80px,14vw,180px);margin:0 -14px}
.g2-juntos{display:grid;gap:12px}
.g2-juntos li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:#fff;border-radius:18px;padding:14px 16px;font-size:15px}
.g2-juntos li i{font-size:22px;color:var(--c)}
.g2-juntos b{display:block;font-size:15px}
.g2-juntos span{color:var(--ink-2);font-size:14px}
.g2-conta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--linha)}
.g2-conta .total{font-size:32px;font-weight:600;letter-spacing:-.03em}
.g2-conta s{color:var(--ink-2);font-size:15px;margin-left:8px}
.g2-conta .economia{display:block;font-size:13px;color:#0f7a50;font-weight:600;letter-spacing:0}
.g2-pico .pill:disabled{opacity:.4;cursor:not-allowed}

/* cartazes 4:5: uma cor chapada por produto, texto escuro */
.g2-cartazes{grid-auto-columns:min(320px,76vw);padding-block:8px 24px}
.cartaz{aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;background:var(--fundo);color:var(--ink)}
.cartaz h3{font-size:clamp(28px,2.8vw,36px);font-weight:600;letter-spacing:-.035em;line-height:1}
.cartaz p{font-size:14px;margin-top:8px;color:rgba(29,29,31,.78)}
.cartaz .art{position:absolute;inset:12% 8% 34%;z-index:-1}
.cartaz .art img{mix-blend-mode:normal;position:absolute;inset:0}

/* Personalize: um palco largo, não um cartão de produto */
.g2-perso{margin:0 var(--gut);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.g2-mesa{border-radius:36px;background:#fff3d1;min-height:380px;display:grid;place-items:center;position:relative;overflow:hidden}
.g2-tampa{width:min(420px,82%);aspect-ratio:3/2;border-radius:22px;background:linear-gradient(140deg,#ffd23f,#ff9f1c);display:grid;place-items:center;
  box-shadow:0 26px 40px -16px rgba(120,60,0,.35),inset 0 0 0 1px rgba(255,255,255,.45)}
.g2-tampa span{font-size:clamp(18px,2.4vw,28px);font-weight:600;letter-spacing:-.01em;color:rgba(110,55,0,.6);text-shadow:0 1px 0 rgba(255,255,255,.55);
  max-width:88%;overflow-wrap:anywhere;text-align:center}
.g2-mesa .adesivo{position:absolute;width:clamp(90px,11vw,130px);right:6%;top:8%;transform:rotate(10deg)}
.g2-perso h3{font-size:clamp(26px,2.6vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.g2-perso .lead{margin:10px 0 20px}
.g2-grav-in{width:100%;border:1px solid var(--linha);border-radius:14px;padding:13px 16px;font-size:17px}
.g2-grav-in:focus-visible{outline-offset:0;border-color:var(--focus)}
.g2-conta-grav{font-size:13px;color:var(--ink-2);margin-top:8px;letter-spacing:0}
.g2-peels{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--linha)}
.g2-peels p{font-size:15px;color:var(--ink-2)}
.g2-peels b{color:var(--ink)}

/* Por que Mango: seção preta com vídeo-manifesto e bento */
.g2-mango{margin-top:112px;background:#000;color:#f5f5f7;padding:112px var(--gut)}
.g2-mango .h-sec span{color:#a1a1a6}
.g2-video{margin:36px 0 20px;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;
  background:radial-gradient(40% 60% at 30% 40%,#ff9f1c77,transparent 70%),radial-gradient(50% 60% at 75% 60%,#7b5cff77,transparent 70%),#111}
.g2-play{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:34px;color:#fff;transition:transform .2s var(--out)}
.g2-play:hover{transform:scale(1.06)}
.g2-video figcaption{position:absolute;left:24px;bottom:22px;font-size:15px;color:#d2d2d7}
.g2-bento{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.g2-b{border-radius:28px;background:#1d1d1f;padding:28px;min-height:260px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.g2-b h3{font-size:clamp(24px,2.4vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1.08}
.g2-b p{color:#a1a1a6;margin-top:8px;font-size:15px;max-width:34ch}
.g2-b .mais{margin-top:auto;padding-top:14px;font-size:15px;color:#2997ff}
.g2-b.l3{grid-column:span 3}.g2-b.l2{grid-column:span 2}.g2-b.l4{grid-column:span 4}
.g2-b.cores{background:#fff;color:var(--ink);min-height:340px}
.g2-b.cores p{color:var(--ink-2)}
.g2-b.cores img{position:absolute;right:-1%;bottom:-3%;width:68%}
.g2-b.mangy{background:linear-gradient(150deg,#ff9f1c,#fd228a);color:#1d1d1f}
.g2-b.mangy p{color:#1d1d1f;max-width:20ch}
.g2-b.mangy img{position:absolute;right:-8%;bottom:0;height:64%;width:auto}
.g2-b.mangy .mais{color:#1d1d1f}
.g2-b .ico-grande{font-size:44px;margin-bottom:16px;color:var(--c)}

/* Oficinas: foto neutra (espaço da foto real) e a data em destaque */
.g2-hoje{grid-auto-columns:min(320px,80vw);padding-block:8px 24px}
.g2-hoje article{border-radius:24px;background:var(--tile);overflow:hidden;display:flex;flex-direction:column}
.g2-hoje .foto{aspect-ratio:3/2;background:#e8e8ed;position:relative;display:grid;place-items:center;color:var(--ink-3);font-size:40px}
.g2-hoje .dia{position:absolute;left:14px;bottom:14px;background:#fff;border-radius:14px;padding:6px 12px;text-align:center;line-height:1.1;color:var(--ink)}
.g2-hoje .dia b{display:block;font-size:24px;letter-spacing:-.03em}
.g2-hoje .dia small{font-size:11px;font-weight:600;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.g2-hoje .txt{padding:20px 22px 22px;display:flex;flex-direction:column;gap:4px;flex:1}
.g2-hoje h3{font-size:19px;letter-spacing:-.02em;line-height:1.2}
.g2-hoje p{color:var(--ink-2);font-size:15px}
.g2-hoje .mais{margin-top:auto;padding-top:10px;font-size:15px}

/* Lojas especiais + links rápidos + parceiros numa faixa neutra (claramente de outra marca) */
.g2-lojas{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 var(--gut)}
.g2-loja{border-radius:24px;background:var(--tile);padding:26px;min-height:180px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.g2-loja:hover{text-decoration:none;background:#ededf0}
.g2-loja i{font-size:30px;color:var(--c);margin-bottom:8px}
.g2-loja h3{font-size:22px;letter-spacing:-.025em}
.g2-loja p{color:var(--ink-2);font-size:15px}
.g2-rapidos{display:flex;flex-wrap:wrap;gap:10px;padding:24px var(--gut) 0}
.g2-rapidos a{padding:10px 18px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--linha);color:var(--ink);font-size:15px}
.g2-rapidos a:hover{background:var(--tile);text-decoration:none}
.g2-parc{margin:56px var(--gut) 0;padding-top:24px;border-top:1px solid var(--linha);display:grid;grid-template-columns:auto repeat(4,1fr);gap:14px;align-items:center}
.g2-parc>span{font-size:12px;color:var(--ink-2);letter-spacing:0;padding-right:10px}
.g2-parc a{aspect-ratio:3/1;border-radius:14px;box-shadow:inset 0 0 0 1px var(--linha);display:grid;place-items:center;color:var(--ink);font-weight:600;font-size:17px;letter-spacing:-.01em}
.g2-parc a:hover{text-decoration:none;background:var(--tile)}

/* fechamento: os olhos do Mangy e a assinatura (único "Pense doce." grande da página) */
.g2-fim{margin-top:112px;display:grid;justify-items:center;gap:22px;padding:0 var(--gut) 112px;text-align:center}
.g2-fim img{width:min(560px,90%);border-radius:28px}
.g2-fim h2{font-size:clamp(40px,6vw,80px);font-weight:600;letter-spacing:-.04em;line-height:1}

@media (max-width:860px){
  .g2-kit,.g2-perso{grid-template-columns:1fr}
  .g2-bento{grid-template-columns:1fr}.g2-b.l2,.g2-b.l3,.g2-b.l4{grid-column:auto}
  .g2-lojas{grid-template-columns:1fr}
  .g2-parc{grid-template-columns:1fr 1fr}.g2-parc>span{grid-column:1/-1}
  .g2-camp{grid-template-columns:1fr;aspect-ratio:auto}
  .g2-camp .cena{min-height:240px}
  .g2-pagina .g-bloco{padding-top:80px}
  .g2-pico{padding-top:104px!important}
}

/* ===== 2 · BENTO ===== */
.b-nav{position:sticky;top:0;z-index:40;height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--gut);
  border-radius:0}
.b-nav .g-links{flex:1;justify-content:center}
.b-head{padding:56px var(--gut) 22px;display:grid;gap:18px}
.b-head h1{font-size:clamp(36px,5.4vw,64px);font-weight:600;letter-spacing:-.045em;line-height:1.04;text-wrap:balance}
.b-head h1 span{background:linear-gradient(95deg,#ff9f1c,#ff5e7e 35%,#a46bff 70%,#3aa0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.b-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:230px;gap:14px;padding:0 var(--gut)}
.b-t{position:relative;border-radius:28px;background:var(--t);padding:22px;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .22s var(--out),box-shadow .22s var(--out),opacity .25s ease-out,filter .25s ease-out}
.b-t.apagado{opacity:.28;filter:saturate(.3)}
.b-t h3{font-size:21px;letter-spacing:-.02em;line-height:1.15}
.b-t .frase{font-size:14px;color:var(--ink-2);letter-spacing:0}
.b-t .art{position:absolute;left:12%;right:12%;bottom:52px;top:96px}
.b-t-pe{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.b-g{grid-column:span 2;grid-row:span 2}
.b-g h3{font-size:clamp(32px,4vw,48px);letter-spacing:-.04em}
.b-g .art{top:130px;bottom:70px}
.b-w{grid-column:span 2}
.b-w .art{left:46%;right:4%;top:18px;bottom:18px}
.b-sec{padding:72px var(--gut) 0}
.b-sec .h-sec{font-size:clamp(28px,3.6vw,40px);margin-bottom:22px}
.b-serv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.b-serv .serv{border-radius:24px;background:var(--tile);padding:22px;display:grid;gap:8px;align-content:start;text-align:left;min-height:170px}
.b-serv .serv h3{font-size:17px;letter-spacing:-.02em;line-height:1.25}
.b-serv .serv p{font-size:13px;color:var(--ink-2);letter-spacing:0}
.b-duo{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;align-items:start}
.b-caixa{border-radius:28px;background:var(--tile);padding:28px}
.b-acess{display:grid;gap:12px}
.b-acess .linha{position:relative;display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:12px}
.b-acess .art{height:64px;border-radius:14px;background:var(--t)}
.b-acess h3{font-size:16px}
.b-fim{height:72px}
@media (max-width:900px){.b-serv{grid-template-columns:repeat(2,minmax(0,1fr))}.b-duo{grid-template-columns:1fr}}
@media (max-width:760px){.b-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:220px}.b-w{grid-column:span 2}}
@media (max-width:480px){.b-grid{grid-template-columns:1fr;grid-auto-rows:260px}.b-g,.b-w{grid-column:auto;grid-row:auto}.b-g h3{font-size:30px}.b-g .art{top:96px;bottom:56px}.b-w .art{left:12%;right:12%;top:96px;bottom:52px}.b-serv{grid-template-columns:1fr}}

/* ===== 3 · EDITORIAL ===== */
.e-nav{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 var(--gut)}
.e-marca{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.e-marca:hover{text-decoration:none}
.e-marca .logo{width:18px;height:21px}
.e-nav .g-links{font-size:15px;letter-spacing:-.01em}
.e-hero{padding:clamp(80px,12vw,150px) var(--gut) 72px}
.e-hero h1{font-size:clamp(64px,13vw,184px);font-weight:600;letter-spacing:-.06em;line-height:.9}
.e-hero h1 span{background:linear-gradient(100deg,#e8890c,#f4b41a 45%,#ef7d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
.e-hero-pe{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:40px}
.e-hero-pe p{max-width:420px}
.e-indice{padding:0 var(--gut) 40px}
.e-indice h2,.e-rot{font-size:13px;color:var(--ink-2);font-weight:400;letter-spacing:0;margin-bottom:12px}
.e-indice a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-top:1px solid var(--linha);color:var(--ink);
  font-size:clamp(28px,4.2vw,52px);font-weight:600;letter-spacing:-.04em;line-height:1.1;transition:color .2s var(--ease)}
.e-indice a:hover{text-decoration:none;color:var(--c)}
.e-indice a small{font-size:15px;font-weight:400;color:var(--ink-2);letter-spacing:0;white-space:nowrap}
.e-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(24px,5vw,72px);padding:96px var(--gut);border-top:1px solid var(--linha);position:relative}
.e-row:nth-of-type(even) .e-txt{order:2}
.e-txt h3{font-size:clamp(44px,6.4vw,88px);font-weight:600;letter-spacing:-.05em;line-height:.98}
.e-txt .lead{margin:16px 0 26px;color:var(--ink)}
.e-txt .preco{display:block;margin-bottom:18px;font-size:15px}
.e-cta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.e-row .art{aspect-ratio:1;border-radius:36px;background:var(--t);padding:8%}
.e-row .salvar{top:96px;right:var(--gut)}
.e-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:36px 48px;padding:0 var(--gut) 96px}
.e-cols .serv{display:grid;gap:8px;text-align:left;border-top:1px solid var(--ink);padding-top:18px}
.e-cols .serv h3{font-size:24px;letter-spacing:-.03em;line-height:1.15}
.e-cols .serv p{color:var(--ink-2);font-size:15px}
.e-tit{padding:96px var(--gut) 40px;border-top:1px solid var(--linha)}
.e-acess{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;padding:0 var(--gut) 96px}
.e-acess article{position:relative}
.e-acess .art{aspect-ratio:16/10;border-radius:32px;background:var(--t);margin-bottom:18px}
.e-acess h3{font-size:32px;letter-spacing:-.035em}
.e-cmp{padding:0 var(--gut) 112px}
@media (max-width:760px){.e-row{grid-template-columns:1fr;padding-block:64px}.e-row:nth-of-type(even) .e-txt{order:0}.e-row .salvar{top:64px}.e-acess{grid-template-columns:1fr}}

/* ===== 4 · CATÁLOGO ===== */
.c-top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:10px var(--gut)}
.c-marca{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.02em}
.c-marca:hover{text-decoration:none}
.c-busca{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.05);border-radius:12px;padding:0 12px;max-width:560px;width:100%;justify-self:center}
.c-busca i{font-size:18px;color:var(--ink-2)}
.c-busca input{flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 0;font-size:15px}
.c-busca:focus-within{box-shadow:0 0 0 3px rgba(0,113,227,.25)}
.c-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding:28px var(--gut) 72px}
.c-side{position:sticky;top:84px;align-self:start;display:grid;gap:28px}

.c-faixa{display:grid;gap:6px}
.c-faixa input{width:100%;accent-color:var(--ink)}
.c-faixa output{font-size:14px;color:var(--ink-2);letter-spacing:0}
.c-banner{position:relative;display:grid;grid-template-columns:1fr 200px;align-items:center;gap:16px;border-radius:24px;background:var(--t);padding:22px 28px;margin-bottom:24px;overflow:hidden}
.c-banner h2{font-size:28px;letter-spacing:-.035em;line-height:1.1}
.c-banner .art{height:140px}
.c-barra{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-size:14px;color:var(--ink-2);letter-spacing:0}
.c-barra select{border:1px solid var(--linha);border-radius:10px;padding:6px 10px;background:#fff;font-size:14px}
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.c-card{position:relative;border-radius:22px;border:1px solid #e8e8ed;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.c-card .art{aspect-ratio:4/3;border-radius:14px;background:var(--t);margin-bottom:8px}
.c-card h3{font-size:17px;letter-spacing:-.02em}
.c-card .frase{font-size:13px;color:var(--ink-2);letter-spacing:0}
.c-card-pe{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.c-card .salvar{top:22px;right:22px;width:34px;height:34px;font-size:17px}
.c-vazio{grid-column:1/-1;text-align:center;padding:64px 0;display:grid;gap:10px;justify-items:center}
.c-serv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:48px}
.c-serv .serv{display:grid;gap:6px;align-content:start;text-align:left;padding:16px;border-radius:16px;background:var(--tile)}
.c-serv .serv h3{font-size:15px;letter-spacing:-.01em}
.c-serv .serv p{font-size:12px;color:var(--ink-2);letter-spacing:0}
.c-serv .serv-ic{font-size:24px}
.c-cmp{margin-top:56px;padding-top:40px;border-top:1px solid var(--linha)}
.c-cmp .h-sec{font-size:32px;margin-bottom:24px}
.c-filtros{display:none}
@media (max-width:860px){
  .c-wrap{grid-template-columns:1fr;gap:16px}
  .c-side{position:static}
  .c-side .c-extra{display:none}
  .c-cats{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none}
  .c-cats button{border-radius:980px;background:var(--tile);gap:6px}
  .c-serv{grid-template-columns:repeat(2,minmax(0,1fr))}

}

.c-top{grid-template-columns:auto minmax(0,1fr) auto}

.e-indice a{flex-wrap:wrap}

.p-top{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px var(--gut)}

.p-dock{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:26px;
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}

.p-sec{padding:96px var(--gut)}
.p-quiz{background:var(--tile);border-radius:36px;margin:0 var(--gut);padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}

.p-quiz .chip{background:#fff;font-size:15px;padding:10px 16px}
.p-quiz .chip:hover{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.p-rec{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;background:#fff;border-radius:24px;padding:18px}
.p-rec .art{height:96px;border-radius:16px;background:var(--t)}
.p-serv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.p-serv .serv{display:grid;justify-items:center;gap:8px;text-align:center;padding:24px 12px;border-radius:24px;transition:background .2s}
.p-serv .serv:hover{background:var(--tile)}
.p-serv .serv h3{font-size:15px;letter-spacing:-.01em}
.p-serv .serv p{font-size:12px;color:var(--ink-2);letter-spacing:0}
.p-acess{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p-acess article{position:relative;border-radius:28px;background:var(--t);padding:24px;display:grid;gap:4px;min-height:340px;align-content:start}

@media (max-width:860px){.p-quiz{grid-template-columns:1fr}.p-serv{grid-template-columns:repeat(2,minmax(0,1fr))}.p-acess{grid-template-columns:1fr}}

init(root) {
  const kit = root.querySelector('[data-kit]');
  const desenhar = () => {
    const sel = [...kit.querySelectorAll('[data-kit-id][aria-pressed=true]')].map(b => b.dataset.kitId);
    const soma = sel.reduce((a, id) => a + byId(id).preco, 0), d = descontoKit(sel.length), total = Math.round(soma * (1 - d));
    kit.querySelector('[data-kit-palco]').innerHTML = sel.map(id => `<span class="art" style="${vars(byId(id))}">${art(byId(id))}</span>`).join('');
    kit.querySelector('[data-kit-total]').textContent = sel.length ? brl(total) : 'Escolha um aparelho';
    kit.querySelector('[data-kit-de]').textContent = d ? brl(soma) : '';
    kit.querySelector('[data-kit-eco]').textContent = d ? `Você economiza ${brl(soma - total)} (${d * 100}% por levar ${sel.length})` : sel.length ? 'Leve 2 e ganhe 5%. Leve 3 ou mais e ganhe 10%.' : '';
    const add = kit.querySelector('[data-kit-add]'); add.dataset.id = sel.join(','); add.disabled = !sel.length;
    const js = juntos(sel);
    kit.querySelector('[data-kit-juntos]').innerHTML = js.length
      ? js.map(j => `<li style="--c:${j.c}">${icon(j.ic)}<div><b>${j.t}</b><span>${j.d}</span></div></li>`).join('')
      : `<li style="--c:var(--ink-2)">${icon('ph-plus-circle')}<div><b>Escolha mais um.</b><span>Com dois ou mais, aparece aqui o que eles fazem juntos.</span></div></li>`;
  };
  kit.addEventListener('click', e => { const b = e.target.closest('[data-kit-id]'); if (b) { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); desenhar(); } });
  desenhar();
  // gravação: conta caracteres de verdade (um emoji conta como 1), corta em 24
  const gr = root.querySelector('[data-grav]'), conta = root.querySelector('[data-grav-conta]');
  root.querySelector('[data-grav-in]').addEventListener('input', e => {
    const letras = [...e.target.value];
    if (letras.length > 24) e.target.value = letras.slice(0, 24).join('');
    const n = Math.min(letras.length, 24);
    gr.textContent = e.target.value.trim() || 'Pense doce.';
    conta.textContent = n ? `${n} de 24 caracteres.` : 'Até 24 caracteres.';
  });
  const vale = root.querySelector('[data-vale]');
  root.querySelector('.g2-valores').addEventListener('click', e => {
    const b = e.target.closest('[data-vale-v]'); if (!b) return;
    b.parentElement.querySelectorAll('[data-vale-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
    vale.innerHTML = `<small>R$</small>${b.dataset.valeV}`;
  });
}};

init(root) {

      (p.nome + ' ' + p.cat).toLowerCase().includes(st.q));
    if (st.sort !== 'dest') list = [...list].sort((a, b) => st.sort === 'menor' ? a.preco - b.preco : b.preco - a.preco);

  root.querySelectorAll('[data-ccor]').forEach(b => b.addEventListener('click', () => {

    root.querySelectorAll('[data-ccor]').forEach(x => x.setAttribute('aria-pressed', x.dataset.ccor === st.cor)); draw(); }));
  const max = root.querySelector('[data-cmax]'), out = root.querySelector('[data-cmax-out]');

  grid.addEventListener('click', e => { if (!e.target.closest('[data-climpar]')) return;

}};

    <div class="p-serv">${SERV.map(s => `<button class="serv" style="--c:${s.c}" ${servBtn(s)}><span class="serv-ic">${icon(s.ic)}</span><h3>${s.t}</h3><p>${s.d}</p></button>`).join('')}</div></section>
  <section class="p-sec" id="acessorios" style="padding-top:0" aria-labelledby="p-a-t"><h2 class="h-sec" id="p-a-t" style="margin-bottom:28px">Acessórios.</h2>
    <div class="p-acess">${[byId('seeds'), byId('peels'), capa].map(p => `<article class="lift" style="${vars(p)}">${p.id !== 'capa' ? salvar(p) : ''}<h3>${p.nome}</h3><p class="preco">${brl(p.preco)}</p><div class="art">${art(p)}</div>${p.id === 'capa' ? capas() : comprar(p)}</article>`).join('')}</div></section>
  <section class="p-sec" style="padding-top:0" aria-labelledby="p-c-t"><h2 class="h-sec" id="p-c-t" style="margin-bottom:32px">Compare. <span>Lado a lado.</span></h2>${comparar()}</section>
</main>${rodape()}`,
init(root) {
  const stage = root.querySelector('[data-pstage]'), box = root.querySelector('[data-pconteudo]');
  function show(id) {
    const p = byId(id);
    stage.style.cssText = vars(p);
    root.querySelectorAll('[data-pid]').forEach(b => b.setAttribute('aria-current', b.dataset.pid === id));
    box.innerHTML = `<div class="p-conteudo p-troca" id="prod-${p.id}">${p.novo ? '<span class="selo">Novo</span>' : `<span class="selo" style="color:var(--ink-2)">${p.cat}</span>`}
      <h1>${p.nome}</h1><p class="lead">${p.frase}</p><div class="art">${art(p)}</div>
      <p class="preco">A partir de ${brl(p.preco)} ou ${parcela(p.preco)}</p><div class="p-cta">${comprar(p, 'pill')}<a class="mais" href="#">Saiba mais</a></div></div>`;
    sync();
  }
  root.querySelectorAll('[data-pid]').forEach(b => b.addEventListener('click', () => show(b.dataset.pid)));
  show('go');
  const qz = root.querySelector('[data-pquiz]'); let passo = 0, votos = {};
  function quiz() {
    if (passo < QUIZ.length) {
      const q = QUIZ[passo];
      qz.innerHTML = `<div class="p-passos" aria-hidden="true">${QUIZ.map((_, i) => `<span class="${i <= passo ? 'on' : ''}"></span>`).join('')}</div>
        <p class="p-perg">${q.q}</p><div class="chips">${q.r.map(([t, id]) => `<button class="chip" data-voto="${id}">${t}</button>`).join('')}</div>`;
    } else {
      const id = Object.entries(votos).sort((a, b) => b[1] - a[1])[0][0], p = byId(id);
      qz.innerHTML = `<p class="p-perg">A gente aposta no:</p><div class="p-rec p-troca" style="${vars(p)}"><div class="art">${art(p)}</div>
        <div><h3 style="font-size:24px;letter-spacing:-.03em">${p.nome}</h3><p class="preco" style="margin:2px 0 12px">A partir de ${brl(p.preco)}</p>${comprar(p)}</div></div>
        <button class="mais" style="margin-top:14px;font-size:15px" data-refazer>Refazer</button>`;
    }
  }
  qz.addEventListener('click', e => {
    const v = e.target.closest('[data-voto]');
    if (v) { votos[v.dataset.voto] = (votos[v.dataset.voto] || 0) + 1; passo++; quiz(); }
    if (e.target.closest('[data-refazer]')) { passo = 0; votos = {}; quiz(); }
  });
  quiz();
}};

/* ===== Estado compartilhado (sacola, salvos, conta) ===== */
const S = {cart: {}, saved: [], user: null, aviso: false, pedido: false};
try { Object.assign(S, JSON.parse(localStorage.getItem('mango-loja') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('mango-loja', JSON.stringify(S)); } catch (e) {} };
const nItens = () => Object.values(S.cart).reduce((a, b) => a + b, 0);

function sync() {
  const n = nItens();
  document.querySelectorAll('[data-badge]').forEach(b => { b.textContent = n; b.dataset.n = n; });
  document.querySelectorAll('[data-act=sacola]').forEach(b => b.setAttribute('aria-label', n ? `Sacola, ${n} ${n === 1 ? 'item' : 'itens'}` : 'Sacola'));
  document.querySelectorAll('[data-user]').forEach(b => b.textContent = S.user ? 'Olá, ' + S.user : 'Entrar');
  document.querySelectorAll('.salvar').forEach(b => {
    const on = S.saved.includes(b.dataset.id);
    b.setAttribute('aria-pressed', on);
    b.firstElementChild.className = (on ? 'ph-fill' : 'ph-light') + ' ph-heart';
  });
  document.body.toggleAttribute('data-aviso-fechado', S.aviso);
  document.querySelector('[data-form-entrar]').hidden = !!S.user;
  document.querySelector('[data-logado]').hidden = !S.user;
  document.querySelector('[data-ola]').textContent = 'Olá, ' + S.user + '.';
  desenharSacola();
}

function desenharSacola() {
  const corpo = document.querySelector('[data-sacola-corpo]'), pe = document.querySelector('[data-sacola-pe]');
  if (S.pedido) {
    corpo.innerHTML = `<div class="ok"><i class="ph-light ph-check-circle"></i><p style="font-size:21px;font-weight:600">Pedido feito.</p><p class="preco">Já estamos escolhendo as mais maduras.</p></div>`;
    pe.innerHTML = `<button class="pill claro" data-act="novo-pedido">Continuar comprando</button>`; return;
  }
  const ids = Object.keys(S.cart);
  if (!ids.length) {
    corpo.innerHTML = `<div class="vazio"><i class="ph-light ph-bag"></i><p style="font-size:21px;font-weight:600">Sua fruteira está vazia.</p><button class="mais" data-act="fechar">Ver produtos</button></div>`;
    pe.innerHTML = ''; return;
  }
  const total = ids.reduce((s, id) => s + byId(id).preco * S.cart[id], 0);
  corpo.innerHTML = ids.map(id => { const p = byId(id); return `<div class="item" style="${vars(p)}"><div class="art">${art(p)}</div>
    <div><p class="item-nome">${p.nome}</p><div class="qtd" role="group" aria-label="Quantidade de ${p.nome}"><button data-act="qtd" data-id="${id}" data-d="-1" aria-label="Diminuir">${icon(S.cart[id] > 1 ? 'ph-minus' : 'ph-trash')}</button><span>${S.cart[id]}</span><button data-act="qtd" data-id="${id}" data-d="1" aria-label="Aumentar">${icon('ph-plus')}</button></div></div>
    <span class="preco" style="color:var(--ink)">${brl(p.preco * S.cart[id])}</span></div>`; }).join('');
  pe.innerHTML = `<div class="linha-total"><span>Entrega</span><span style="color:var(--verde)">Grátis</span></div>
    <div class="linha-total"><span>Total</span><strong>${brl(total)}</strong></div><p class="preco">ou ${parcela(total)} sem juros</p>
    <button class="pill" data-act="finalizar">Finalizar compra</button>${S.user ? '' : '<p class="nota" style="margin:0">Dica: <button class="mais" style="font-size:12px" data-act="entrar">entre com a Mango ID</button> pra finalizar mais rápido.</p>'}`;
}

/* ===== Abrir e fechar painéis ===== */
const veu = document.querySelector('.veu');
let aberto = null, gatilho = null;
function abrir(id, de) {
  if (aberto) fechar(false);
  aberto = document.getElementById('p-' + id); gatilho = de;
  if (id === 'busca') buscar('');
  veu.hidden = false; aberto.hidden = false;
  requestAnimationFrame(() => { veu.dataset.open = ''; aberto.dataset.open = '';
    (aberto.querySelector('[data-foco]:not([hidden] *)') || aberto.querySelector('button,input,a')).focus(); });
}
function fechar(volta = true) {
  if (!aberto) return;
  const el = aberto; aberto = null;
  delete el.dataset.open; delete veu.dataset.open;
  setTimeout(() => { if (aberto !== el) el.hidden = true; if (!aberto) veu.hidden = true; }, 280);
  if (volta && gatilho && document.contains(gatilho)) gatilho.focus();
}
function buscar(q) {
  const res = document.querySelector('[data-busca-res]'); q = q.trim().toLowerCase();
  const list = q ? P.filter(p => (p.nome + ' ' + p.cat).toLowerCase().includes(q)) : [];
  res.innerHTML = !q
    ? `<h3>Mais buscados</h3><div class="chips">${['Go D1', 'MangoBook Pure', 'Mango Seeds', 'Mango Time'].map(t => `<button class="chip" data-act="sugere" data-q="${t}">${t}</button>`).join('')}</div>`
    : list.length ? `<h3>${list.length} ${list.length === 1 ? 'resultado' : 'resultados'}</h3>` + list.map(p => `<button class="res" data-act="ir" data-id="${p.id}" style="${vars(p)}"><span class="art">${art(p)}</span><span><b>${p.nome}</b><br><span class="preco">${p.cat}</span></span><span class="preco">${brl(p.preco)}</span></button>`).join('')
    : `<h3>Nada por aqui</h3><p class="preco">Essa busca caiu do pé. Tente "Go D1" ou "MangoBook".</p>`;
}
document.getElementById('busca-in').addEventListener('input', e => buscar(e.target.value));
document.querySelector('[data-menu-lista]').innerHTML = P.map(p => `<a href="#prod-${p.id}" data-act="fechar">${p.nome}</a>`).join('') + `<a href="#servicos" data-act="fechar">Ajuda</a>`;

document.querySelector('[data-form-entrar]').addEventListener('submit', e => {
  e.preventDefault();
  const n = document.getElementById('en-email').value.split('@')[0].replace(/[._-]+/g, ' ').trim();
  S.user = n ? n.charAt(0).toUpperCase() + n.slice(1) : 'você'; save(); sync(); fechar();
});
function responder(t, r) {
  const log = document.querySelector('[data-chat-log]');
  log.insertAdjacentHTML('beforeend', `<p class="bolha eu">${t}</p>`);
  setTimeout(() => { log.insertAdjacentHTML('beforeend', `<p class="bolha">${r}</p>`); log.scrollTop = log.scrollHeight; }, 450);
  log.scrollTop = log.scrollHeight;
}
document.querySelector('[data-form-chat]').addEventListener('submit', e => {
  e.preventDefault(); const i = document.getElementById('chat-in'), t = i.value.trim(); if (!t) return;
  i.value = ''; responder(t.replace(/</g, '&lt;'), 'Boa pergunta! Já passei pra um especialista, a resposta chega aqui em instantes.');
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (t.tagName === 'A' && a !== 'fechar') e.preventDefault();
  if (['sacola', 'busca', 'entrar', 'chat', 'menu'].includes(a)) return abrir(a, t);
  if (a === 'fechar') return fechar(t.tagName !== 'A');
  if (a === 'add') {
    for (const k of id.split(',')) S.cart[k] = (S.cart[k] || 0) + 1; // o kit manda vários ids de uma vez
    S.pedido = false; save(); sync();
    const txt = t.innerHTML; t.textContent = 'Na sacola ✓'; t.disabled = true;
    setTimeout(() => { t.innerHTML = txt; t.disabled = false; }, 1100);
  }
  if (a === 'salvar') { S.saved = S.saved.includes(id) ? S.saved.filter(x => x !== id) : [...S.saved, id]; save(); sync(); }
  if (a === 'qtd') { S.cart[id] += +t.dataset.d; if (S.cart[id] <= 0) delete S.cart[id]; save(); sync(); }
  if (a === 'finalizar') { S.cart = {}; S.pedido = true; save(); sync(); document.querySelector('#p-sacola .painel-x').focus(); }
  if (a === 'novo-pedido') { S.pedido = false; save(); sync(); fechar(); }
  if (a === 'fechar-aviso') { S.aviso = true; save(); sync(); }
  if (a === 'sair') { S.user = null; save(); sync(); fechar(); }
  if (a === 'sugere') { const i = document.getElementById('busca-in'); i.value = t.dataset.q; buscar(t.dataset.q); i.focus(); }
  if (a === 'perg') responder(t.textContent, t.dataset.r);
  if (a === 'ir') { fechar(false); const alvo = document.getElementById('prod-' + id) || document.querySelector(`[data-pid="${id}"]`);
    if (alvo?.dataset.pid) alvo.click(); else alvo?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'}); }
  if (a === 'rolar') { const el = document.querySelector(t.dataset.alvo); el.scrollBy({left: +t.dataset.dir * el.clientWidth * .8, behavior: 'smooth'}); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && aberto) fechar(); });
document.addEventListener('change', e => { if (e.target.matches('[data-cmp-sel]')) encherComparar(e.target.closest('#stage')); });

/* ===== Seletor (PICKER.md, wiring de referência + init de cada versão) ===== */
const variants = [galeria2, galeria, bento, editorial, catalogo, palco];
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i].html();
    variants[i].init?.(stage);
    encherComparar(stage);
    sync();
  });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
