<!doctype html>
<html lang="pt-BR" data-tema="manga">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mango · Adesivos</title>
<link rel="icon" href="/mango.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Permanent+Marker&family=Righteous&family=Dela+Gothic+One&family=Graduate&display=swap">
<link rel="stylesheet" href="/src/marca/marca.css">
<link rel="stylesheet" href="./temas.css">
<link rel="stylesheet" href="./base.css">
<style>
/* Regra das refs/stickers: 2–3 cores chapadas, uma ideia, borda branca grossa, fundo liso. */
.ad{display:block;width:100%;height:auto;overflow:visible;
  filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.folha{border-radius:28px;padding:56px 48px;background:#ececee;display:grid;grid-template-columns:repeat(4,1fr);gap:56px 48px;align-items:center;justify-items:center}
[data-tema="noite"] .folha{background:#1c1c1e}
.folha .ad{max-width:240px;transition:transform .3s var(--chegada)}
.folha .ad:hover{transform:scale(1.04)}
.folha .largo{grid-column:span 2;width:100%}
.folha .largo .ad{max-width:440px;margin:0 auto}
@media (max-width:900px){ .folha{grid-template-columns:1fr 1fr;padding:32px 24px;gap:40px 28px} }
@media (max-width:520px){ .folha{grid-template-columns:1fr} .folha .largo{grid-column:auto} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset=".55" style="stop-color:var(--g2)"/><stop offset="1" style="stop-color:var(--g3)"/></linearGradient>
    <!-- íris do urso: só cores da marca -->
    <radialGradient id="irisA"><stop offset=".2" stop-color="#ffd23f"/><stop offset=".55" stop-color="#ff5e7e"/><stop offset="1" stop-color="#7b5cff"/></radialGradient>
    <radialGradient id="irisB"><stop offset=".2" stop-color="#3ddc97"/><stop offset=".55" stop-color="#22b5e8"/><stop offset="1" stop-color="#2f7bff"/></radialGradient>
    <linearGradient id="miolo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
    <filter id="papel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="in" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
    <path id="estrela" d="M150 22 L169 66 L216 70 L180 101 L191 147 L150 123 L109 147 L120 101 L84 70 L131 66Z"/>
    <!-- esqueleto das letras MANGO: traço grosso redondo vira letra bolha -->
    <g id="mango-esq" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 168 L46 74 L88 128 L128 66 L136 168"/>
      <path d="M164 170 L198 70 L234 170 M182 132 L218 132"/>
      <path d="M262 170 L266 72 L324 168 L330 68"/>
      <path d="M454 66 C426 46 360 56 358 120 C356 184 438 192 458 148 L416 148"/>
      <ellipse cx="524" cy="120" rx="30" ry="48"/>
    </g>
    <clipPath id="disco"><circle cx="150" cy="140" r="124"/></clipPath>
  </defs>
</svg>

<main class="prancha">
  <section class="bloco" style="display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap">
    <div><p class="rot">Adesivos · série 01</p><h1 style="font-size:clamp(44px,6vw,84px);font-weight:700;letter-spacing:-.05em;line-height:.95">Cola em tudo.</h1></div>
    <p class="mono" style="max-width:320px">Duas ou três cores chapadas, uma ideia por adesivo, borda branca grossa.</p>
  </section>

  <section class="folha" aria-label="Folha de adesivos">
    <!-- Urso de três-quartos -->
    <svg class="ad" viewBox="0 0 240 214" role="img" aria-label="Urso de olhos coloridos">
      <g filter="url(#papel)">
        <circle cx="206" cy="80" r="25" fill="#5e3a1f"/><circle cx="208" cy="82" r="12" fill="#d9a850"/>
        <ellipse cx="128" cy="118" rx="98" ry="84" fill="#5e3a1f"/>
        <ellipse cx="118" cy="116" rx="92" ry="82" fill="#8a5a33"/>
        <circle cx="50" cy="50" r="27" fill="#8a5a33"/><circle cx="52" cy="54" r="14" fill="#d9a850"/>
        <ellipse cx="102" cy="156" rx="56" ry="44" fill="#d9a850"/>
        <ellipse cx="64" cy="100" rx="27" ry="31" fill="#f3ead6" stroke="#2b1a0e" stroke-width="3"/>
        <ellipse cx="152" cy="94" rx="25" ry="29" fill="#f3ead6" stroke="#2b1a0e" stroke-width="3"/>
        <circle cx="66" cy="102" r="18" fill="url(#irisA)" stroke="#2b1a0e" stroke-width="2"/>
        <circle cx="150" cy="96" r="17" fill="url(#irisB)" stroke="#2b1a0e" stroke-width="2"/>
        <circle cx="66" cy="102" r="5" fill="#2b1a0e"/><circle cx="150" cy="96" r="5" fill="#2b1a0e"/>
        <circle cx="59" cy="94" r="4" fill="#fff"/><circle cx="143" cy="88" r="4" fill="#fff"/>
        <circle cx="74" cy="110" r="3" fill="#22b5e8"/><circle cx="157" cy="104" r="3" fill="#ff9f1c"/>
        <ellipse cx="98" cy="128" rx="13" ry="10" fill="#2b1a0e"/>
      </g>
    </svg>

    <!-- Balão de fala -->
    <svg class="ad" viewBox="0 0 240 236" role="img" aria-label="Balão: fuck it, we ball">
      <path d="M34 42 L148 18 L206 58 L212 150 L124 178 L94 222 L92 180 L36 166 Z" fill="#fff" stroke="#1d1d1f" stroke-width="6" stroke-linejoin="round"/>
      <g font-family="Permanent Marker" font-size="34" fill="#1d1d1f" text-anchor="middle" transform="rotate(-5 120 100)">
        <text x="122" y="80">FUCK IT,</text><text x="118" y="118">WE</text><text x="122" y="156">BALL.</text>
      </g>
    </svg>

    <!-- Estrela com rastro de 3 cores -->
    <svg class="ad" viewBox="20 10 210 210" role="img" aria-label="Estrela com rastro colorido">
      <use href="#estrela" transform="translate(-54 54)" fill="#2f7bff" stroke="#2f7bff" stroke-width="14" stroke-linejoin="round"/>
      <use href="#estrela" transform="translate(-36 36)" fill="#ffd23f" stroke="#ffd23f" stroke-width="14" stroke-linejoin="round"/>
      <use href="#estrela" transform="translate(-18 18)" fill="#ff5e7e" stroke="#ff5e7e" stroke-width="14" stroke-linejoin="round"/>
      <use href="#estrela" fill="#fff" stroke="#1d1d1f" stroke-width="6" stroke-linejoin="round"/>
    </svg>

    <!-- Explosão -->
    <svg class="ad" viewBox="0 0 200 200" role="img" aria-label="Explosão">
      <path d="M100 6 L118 62 L170 30 L146 84 L196 100 L146 116 L170 170 L118 138 L100 194 L82 138 L30 170 L54 116 L4 100 L54 84 L30 30 L82 62Z" fill="url(#gT)" stroke="url(#gT)" stroke-width="8" stroke-linejoin="round"/>
    </svg>

    <!-- MANGO em pichação bolha -->
    <div class="largo"><svg class="ad" viewBox="0 20 590 200" role="img" aria-label="Mango em letra de pichação">
      <g transform="rotate(-5 295 120)">
        <use href="#mango-esq" stroke="#7b5cff" stroke-width="78"/>
        <use href="#mango-esq" stroke="#2b1a4f" stroke-width="58"/>
        <use href="#mango-esq" stroke="url(#miolo)" stroke-width="46"/>
        <path d="M30 88 L36 104 M158 102 L166 88 M258 96 L260 84 M372 98 C376 88 384 84 392 84 M510 92 C514 86 520 84 526 84" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"/>

    <!-- Selo RIO -->

      <text x="284" y="166" text-anchor="end" font-family="Righteous" font-size="14" letter-spacing="1" fill="#1d1d1f">DE JANEIRO</text>
      <text x="284" y="182" text-anchor="end" font-family="Righteous" font-size="11" letter-spacing="1.5" fill="#7b5cff">BRASIL · 1565</text>
    </svg></div>

    <!-- Cartaz SÃO PAULO (ref Tokyo) -->
    <svg class="ad" viewBox="0 0 220 290" role="img" aria-label="Cartaz São Paulo">
      <rect width="220" height="290" rx="12" fill="#1d1d1f"/>
      <rect x="10" y="10" width="200" height="226" fill="#fff"/>
      <text x="110" y="58" text-anchor="middle" font-family="Inter" font-weight="800" font-size="33" letter-spacing="-1.5" fill="#1d1d1f">SÃO PAULO</text>
      <text x="110" y="78" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" letter-spacing="3" fill="#7b5cff">TERRA DA GAROA</text>

      <g fill="#1d1d1f">
        <rect x="10" y="196" width="22" height="40"/><rect x="30" y="178" width="18" height="58"/><rect x="46" y="204" width="16" height="32"/>
        <path d="M60 236 L60 170 C78 162 82 182 96 176 C110 170 112 186 124 180 L124 236Z"/>
        <rect x="122" y="160" width="20" height="76"/><rect x="130" y="138" width="4" height="22"/>
        <rect x="142" y="190" width="18" height="46"/><rect x="158" y="172" width="22" height="64"/><rect x="178" y="200" width="32" height="36"/>
      </g>
      <text x="110" y="256" text-anchor="middle" font-family="Inter" font-weight="700" font-size="8.6" letter-spacing="1.4" fill="#fff">MAIOR CIDADE DO HEMISFÉRIO SUL</text>
      <text x="110" y="276" text-anchor="middle" font-family="Inter" font-weight="800" font-size="14" letter-spacing="2" fill="#fff">SP · BRASIL</text>
    </svg>

    <!-- Kaiju kawaii de manga: só contorno -->
    <div class="largo"><svg class="ad" viewBox="0 0 300 320" style="max-width:340px;margin:0 auto" role="img" aria-label="Monstrinho de manga rugindo para o sol">
      <circle cx="150" cy="140" r="124" fill="#f5f2ec"/>
      <g clip-path="url(#disco)" stroke="#7b5cff" stroke-width="7" stroke-linecap="round">
        <path d="M78 84 L-40 20 M78 84 L-40 100 M78 84 L-20 230 M78 84 L20 -40 M78 84 L92 -40 M78 84 L180 -40 M78 84 L300 -10 M78 84 L320 80"/>
      </g>
      <circle cx="78" cy="84" r="22" fill="#f5f2ec" stroke="#1d1d1f" stroke-width="5"/>
      <g fill="#f5f2ec" stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path d="M214 226 C236 236 252 232 262 214 C260 240 236 252 204 238 Z"/>
        <path d="M222 122 C236 110 248 108 256 112 C250 128 240 136 228 140 Z"/>
        <path d="M232 156 C246 148 258 150 266 156 C256 168 246 172 234 172 Z"/>
        <path d="M232 190 C246 186 258 190 264 198 C252 208 240 208 230 204 Z"/>
        <path d="M168 98 C206 96 236 130 234 174 C232 212 206 234 168 234 C130 234 104 212 104 174 C104 132 132 100 168 98 Z"/>
        <path d="M168 98 C164 78 176 64 196 60 C194 80 184 94 168 98 Z"/>
        <path d="M140 228 L138 240 L160 240 L160 232 M182 232 L182 240 L204 240 L202 228"/>
        <path d="M112 166 C98 158 94 146 100 140 C108 144 114 154 118 158"/>
        <path d="M113 122 L101 112 M122 112 L115 98 M106 134 L92 130" fill="none" stroke-width="4"/>
        <path d="M30 240 L46 204 L62 240 M56 240 L70 212 L84 240" fill="none"/>
        <path d="M26 240 L274 240" fill="none"/>
      </g>
      <circle cx="142" cy="150" r="10" fill="#1d1d1f"/><circle cx="180" cy="150" r="10" fill="#1d1d1f"/>
      <circle cx="138" cy="146" r="3.5" fill="#fff"/><circle cx="176" cy="146" r="3.5" fill="#fff"/>
      <ellipse cx="128" cy="170" rx="9" ry="5" fill="#ff5e7e" opacity=".75"/><ellipse cx="194" cy="170" rx="9" ry="5" fill="#ff5e7e" opacity=".75"/>
      <path d="M152 168 Q161 184 170 168 Z" fill="#ff5e7e" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="150" cy="140" r="124" fill="none" stroke="#1d1d1f" stroke-width="5"/>
      <text x="150" y="304" text-anchor="middle" font-family="Dela Gothic One" font-size="54" fill="#7b5cff" stroke="#1d1d1f" stroke-width="8" paint-order="stroke" stroke-linejoin="round" transform="rotate(-3 150 290)">マンゴー</text>
    </svg></div>

    <!-- UNIVERSIDADE MANGO (ref varsity) -->
    <svg class="ad" viewBox="0 0 240 250" role="img" aria-label="Universidade Mango">
      <rect x="4" y="4" width="232" height="242" rx="22" fill="#7b5cff"/>
      <rect x="14" y="14" width="212" height="222" rx="14" fill="#2b1a4f"/>
      <text x="120" y="56" text-anchor="middle" font-family="Graduate" font-size="24" fill="#f5f2ec">UNIVERSIDADE</text>
      <text x="120" y="182" text-anchor="middle" font-family="Graduate" font-size="150" fill="#ffd23f" stroke="#f5f2ec" stroke-width="5" paint-order="stroke">M</text>
      <path d="M150 88 C150 70 164 60 182 60 C178 76 166 86 150 88 Z" fill="#1fb57a" stroke="#f5f2ec" stroke-width="3"/>
      <text x="120" y="220" text-anchor="middle" font-family="Graduate" font-size="30" letter-spacing="2" fill="#f5f2ec">MANGO</text>
    </svg>

    <!-- Arco-íris anos 70 com as 6 cores -->
    <div class="largo"><svg class="ad" viewBox="0 0 280 160" role="img" aria-label="Arco-íris com as seis cores">
      <g fill="none" stroke-width="13" stroke-linecap="round">
        <path d="M30 140 A110 110 0 0 1 250 140" stroke="#ff9f1c"/>

        <path d="M100 140 A40 40 0 0 1 180 140" stroke="#1fb57a"/>

      <g fill="#fff" stroke="#1d1d1f" stroke-width="4" stroke-linejoin="round">
        <path d="M14 152 C6 152 4 138 14 136 C14 124 30 122 34 130 C40 122 56 126 54 138 C64 138 64 152 54 152 Z"/>
        <path d="M226 152 C218 152 216 138 226 136 C226 124 242 122 246 130 C252 122 268 126 266 138 C276 138 276 152 266 152 Z"/>
      </g>
    </svg></div>

    <!-- Rabisco (ref rosto desenhado) -->
    <svg class="ad" viewBox="0 0 220 220" role="img" aria-label="Rosto rabiscado">
      <path d="M50 72 L58 42 L64 68 L72 36 L78 64 L88 32 L94 62 L104 30 L110 60 L120 30 L126 60 L136 32 L142 62 L152 36 L158 66 L168 42 L172 72" fill="none" stroke="#7b5cff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M72 156 C86 146 98 166 112 154 C126 142 136 162 150 150" fill="none" stroke="#1d1d1f" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <!-- Veloz: silhueta de uma cor (ref Sonic) -->
    <svg class="ad" viewBox="0 0 240 180" role="img" aria-label="Silhueta veloz">
      <path d="M30 110 C30 60 80 30 130 36 L200 18 L170 58 L234 60 L182 90 L230 116 L172 120 L198 162 L130 142 C80 162 30 152 30 110 Z" fill="#2f7bff"/>

      <ellipse cx="96" cy="94" rx="8" ry="14" fill="#2f7bff"/>
      <path d="M56 128 C70 136 84 136 96 128" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </section>

  <footer class="rodape"><span>Adesivos · série 01 · 2026</span><span>Personagens e peças originais.</span></footer>
</main>
