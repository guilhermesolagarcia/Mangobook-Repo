<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Quatro sabores: Manga, Rosa, Folha e Prata">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
    @keyframes pulsa { 0%, 20%, 100% { transform: scale(1); } 8% { transform: scale(1.18); } }
    @keyframes anel { 0%, 20%, 100% { opacity: 0; } 4%, 14% { opacity: 1; } }
    .c { transform-box: fill-box; transform-origin: center; animation: pulsa 8s cubic-bezier(.16,1,.3,1) infinite both; }
    .a { opacity: 0; animation: anel 8s ease infinite both; }
    .d2 { animation-delay: 2s; } .d3 { animation-delay: 4s; } .d4 { animation-delay: 6s; }
    @keyframes fundo { 0%, 22% { fill: #fff3d1; } 25%, 47% { fill: #ffe8de; } 50%, 72% { fill: #eaf6df; } 75%, 97% { fill: #eef0f4; } 100% { fill: #fff3d1; } }
    .f { animation: fundo 8s ease-in-out infinite; }
  </style>
  <rect class="f" width="1200" height="200" rx="32" fill="#fff3d1"/>
  <g transform="translate(150 0)">
    <circle class="a" cx="0" cy="88" r="44" fill="none" stroke="#1d1d1f" stroke-width="3"/>
    <circle class="c" cx="0" cy="88" r="36" fill="#f4b41a"/>
    <text x="0" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#1d1d1f">Manga</text>
  </g>
  <g transform="translate(450 0)">
    <circle class="a d2" cx="0" cy="88" r="44" fill="none" stroke="#1d1d1f" stroke-width="3"/>
    <circle class="c d2" cx="0" cy="88" r="36" fill="#f3b49c"/>
    <text x="0" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#1d1d1f">Rosa</text>
  </g>
  <g transform="translate(750 0)">
    <circle class="a d3" cx="0" cy="88" r="44" fill="none" stroke="#1d1d1f" stroke-width="3"/>
    <circle class="c d3" cx="0" cy="88" r="36" fill="#a8d58a"/>
    <text x="0" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#1d1d1f">Folha</text>
  </g>
  <g transform="translate(1050 0)">
    <circle class="a d4" cx="0" cy="88" r="44" fill="none" stroke="#1d1d1f" stroke-width="3"/>
    <circle class="c d4" cx="0" cy="88" r="36" fill="#d9dadc"/>
    <text x="0" y="168" text-anchor="middle" font-size="22" font-weight="600" fill="#1d1d1f">Prata</text>
  </g>
</svg>
