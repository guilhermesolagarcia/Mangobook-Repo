<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Mango. Pense doce.">
  <defs>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff5e7e"/><stop offset="1" stop-color="#ff5e7e" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a46bff"/><stop offset="1" stop-color="#a46bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3ddc97"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <radialGradient id="b5" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="texto" x1="0" x2="1">
      <stop offset="0" stop-color="#ff9f1c"><animate attributeName="stop-color" values="#ff9f1c;#ff5e7e;#a46bff;#3aa0ff;#3ddc97;#ff9f1c" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff5e7e"><animate attributeName="stop-color" values="#ff5e7e;#a46bff;#3aa0ff;#3ddc97;#ff9f1c;#ff5e7e" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="canto"><rect width="1200" height="420" rx="36"/></clipPath>
    <filter id="borra" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <style>
    .bolha { mix-blend-mode: multiply; }
    @keyframes vagueia1 { 50% { transform: translate(120px, 40px) scale(1.15); } }
    @keyframes vagueia2 { 50% { transform: translate(-140px, -30px) scale(.9); } }
    @keyframes vagueia3 { 50% { transform: translate(80px, -50px) scale(1.2); } }
    @keyframes vagueia4 { 50% { transform: translate(-90px, 60px) scale(1.1); } }
    @keyframes vagueia5 { 50% { transform: translate(60px, 30px) scale(.85); } }
    @keyframes surge { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .v1 { animation: vagueia1 14s ease-in-out infinite; } .v2 { animation: vagueia2 17s ease-in-out infinite; }
    .v3 { animation: vagueia3 19s ease-in-out infinite; } .v4 { animation: vagueia4 15s ease-in-out infinite; }
    .v5 { animation: vagueia5 21s ease-in-out infinite; }
    .s1 { animation: surge 1s cubic-bezier(.16,1,.3,1) .1s both; }
    .s2 { animation: surge 1s cubic-bezier(.16,1,.3,1) .35s both; }
    .s3 { animation: surge 1s cubic-bezier(.16,1,.3,1) .6s both; }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <g clip-path="url(#canto)">
    <rect width="1200" height="420" fill="#fbf9f6"/>
    <g filter="url(#borra)" opacity=".55">
      <circle class="bolha v1" cx="180" cy="90" r="210" fill="url(#b1)"/>
      <circle class="bolha v2" cx="1040" cy="110" r="230" fill="url(#b2)"/>
      <circle class="bolha v3" cx="900" cy="380" r="220" fill="url(#b3)"/>
      <circle class="bolha v4" cx="260" cy="400" r="200" fill="url(#b4)"/>
      <circle class="bolha v5" cx="620" cy="-20" r="180" fill="url(#b5)"/>
    </g>
    <g transform="translate(577 74) scale(.46)"><g class="s1">
      <path fill="#1d1d1f" fill-rule="evenodd" d="M47 27 C67 21 88 35 89 59 C90 86 74 108 50 112 C33 115 16 105 13 87 C11 73 19 66 23 56 C28 43 32 31 47 27 Z M53 56 C61 56 66 65 65 76 C64 87 58 93 52 92 C46 91 43 84 44 75 C45 65 48 56 53 56 Z"/>
      <path fill="#1d1d1f" d="M50 23 C53 11 64 3 79 4 C76 16 65 24 50 23 Z"/>
    </g></g>
    <text class="s2" x="600" y="248" text-anchor="middle" font-size="112" font-weight="700" letter-spacing="-5" fill="#1d1d1f">Mango</text>
    <text class="s3" x="600" y="312" text-anchor="middle" font-size="40" font-weight="600" letter-spacing="-1" fill="url(#texto)">Pense doce.</text>
  </g>
</svg>
